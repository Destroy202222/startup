<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кнопок</title>
    <style>
        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: #1a1a24;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .box h1 {
            color: #ffd700;
        }
        .box button {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .box button:hover {
            opacity: 0.9;
        }
        .box button.secondary {
            background: #444;
            color: #fff;
        }
        #log {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 10px;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            color: #0f0;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success {
            color: #51cf66;
            padding: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>⚡ Тест кнопок</h1>
        <p style="color:#888;margin-bottom:20px;">Проверка работы JavaScript</p>

        <button id="testBtn1">Кнопка 1 (alert)</button>
        <button id="testBtn2" class="secondary">Кнопка 2 (log)</button>
        <button id="testBtn3" class="secondary">Кнопка 3 (изменить текст)</button>

        <div id="log">📋 Журнал:<br></div>
        <div id="result"></div>
    </div>

    <script>
        // ============================================================
        //  ПРОСТЕЙШИЙ ТЕСТ
        // ============================================================

        console.log('🚀 СКРИПТ ЗАПУЩЕН!');

        const log = document.getElementById('log');

        function addLog(text) {
            const time = new Date().toLocaleTimeString();
            log.innerHTML += `<div>[${time}] ${text}</div>`;
            log.scrollTop = log.scrollHeight;
            console.log(text);
        }

        addLog('✅ Скрипт загружен');

        // ---- КНОПКА 1 (alert) ----
        const btn1 = document.getElementById('testBtn1');
        if (btn1) {
            btn1.onclick = function() {
                alert('🎉 Кнопка 1 работает!');
                addLog('🔔 Нажата кнопка 1 (alert)');
            };
            addLog('✅ Кнопка 1 подключена');
        } else {
            addLog('❌ Кнопка 1 не найдена!');
        }

        // ---- КНОПКА 2 (log) ----
        const btn2 = document.getElementById('testBtn2');
        if (btn2) {
            btn2.onclick = function() {
                addLog('🟢 Нажата кнопка 2 (log)');
                console.log('✅ Кнопка 2 нажата');
            };
            addLog('✅ Кнопка 2 подключена');
        } else {
            addLog('❌ Кнопка 2 не найдена!');
        }

        // ---- КНОПКА 3 (изменить текст) ----
        const btn3 = document.getElementById('testBtn3');
        if (btn3) {
            btn3.onclick = function() {
                const result = document.getElementById('result');
                result.innerHTML = '<div class="success">✅ Кнопка 3 сработала!</div>';
                addLog('🟢 Нажата кнопка 3 (изменён текст)');
            };
            addLog('✅ Кнопка 3 подключена');
        } else {
            addLog('❌ Кнопка 3 не найдена!');
        }

        addLog('✅ ВСЕ КНОПКИ ПОДКЛЮЧЕНЫ!');
        addLog('📌 Нажмите любую кнопку');
    </script>

</body>
</html>
