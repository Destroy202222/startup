<style>

.lrow .li{flex:1;min-width:0}.lrow .li b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .li span{color:var(--mut);font-size:12px}

<body>
<div class="brand">StartUp <span>—</span> Brawl Stars</div>
<div id="app" class="card"><h1>Загрузка…</h1></div>

<nav id="nav" class="hidden">
  <button data-t="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Профиль</button>
  <button data-t="matches"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Матчи</button>
  <button data-t="top"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4"/><path d="M12 13v4M10 17h4M8 21h8"/></svg>Топ</button>
  <button data-t="admin" id="navadmin" class="hidden"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>Админ</button>
</nav>
<script>
// ВСТАВЬ после деплоя функции:
const API = "https://wlhzcocwgmzcrtzhefic.supabase.co/functions/v1/api";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsaHpjb2N3Z216Y3J0emhlZmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzQ4ODYsImV4cCI6MjEwNjQ1MDg4Nn0.-Y1jYFT1NO9Nm1SgzNU7QYBA1E8zTZr8aXA768-5cd8";

const tg = Telegram.WebApp; tg.ready(); tg.expand();
tg.setHeaderColor("#0d0d0d"); tg.setBackgroundColor("#0d0d0d");
const app = document.getElementById("app");
const tgUser = tg.initDataUnsafe.user || {};
const ava = tgUser.photo_url || "";

async function call(action, extra = {}) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 15000);
  try {
    const r = await fetch(API, { method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
      body: JSON.stringify({ action, initData: tg.initData, ...extra }) });
    let d = {}; try { d = await r.json(); } catch (_) { d = { error: "http_" + r.status }; }
    if (!r.ok) { d.status = d.status || r.status; throw d; }
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw { error: "timeout" };
    if (e instanceof TypeError) throw { error: "network", detail: e.message };
    throw e;
  } finally { clearTimeout(tm); }
}
const errText = e => ({ tag_not_found: "Тег не найден", tag_taken: "Этот аккаунт уже привязан", bad_auth: "Открой приложение из Telegram", timeout: "Сервер не отвечает (таймаут)", network: "Нет связи с сервером" }[e.error] || "Ошибка, попробуй ещё раз");

function render(p) {
  const v = p.status === "verified";
  document.body.classList.toggle("shell", v);
  document.getElementById("nav").classList.toggle("hidden", !v);
  if (p.status === "verified") return profile(p);
  if (p.status === "pending") return pending(p);
  return upload();
}


const WL = "#0289PYLQGRJCUVO";
function makeCanvas(img, sx, sy, sw, sh, k, mode) {
  const c = document.createElement("canvas");
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    if (mode === "t100") v = v > 100 ? 255 : 0;
    if (mode === "t90inv") v = v > 90 ? 0 : 255;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  return c;
}

// Возвращает список вероятных тегов (самый частый — первый)
async function readTags(file) {
  const img = await createImageBitmap(file);
  const reads = [];
  const grab = (t, strict) => {
    const re = strict ? /#\s*([0289PYLQGRJCUVO]{5,11})/g : /([0289PYLQGRJCUVO]{6,11})/g;
    for (const m of t.toUpperCase().matchAll(re)) reads.push(m[1].replace(/O/g, "0"));
  };
  const w = await Tesseract.createWorker("eng");
  try {
    await w.setParameters({ tessedit_char_whitelist: WL, tessedit_pageseg_mode: "11" });
    const sc = img.width < 1500 ? 1500 / img.width : 1;
    let box = null;
    for (const m of ["gray", "t100", "t90inv"]) {
      const { data } = await w.recognize(makeCanvas(img, 0, 0, img.width, img.height, sc, m));
      grab(data.text, true);
      if (!box) { const wd = (data.words || []).find(q => q.text.includes("#")); if (wd) box = wd.bbox; }
    }
    if (box) {   // повторное чтение только строки с тегом, крупно
      await w.setParameters({ tessedit_pageseg_mode: "7" });
      const h = box.y1 - box.y0, pad = h * 0.6;
      const sx = Math.max(0, (box.x0 - pad) / sc), sy = Math.max(0, (box.y0 - pad) / sc);
      const sw = Math.min(img.width - sx, (box.x1 - box.x0 + 2 * pad) / sc), sh = Math.min(img.height - sy, (h + 2 * pad) / sc);
      for (const m of ["gray", "t90inv", "t100"]) for (const k of [3, 4]) {
        const { data } = await w.recognize(makeCanvas(img, sx, sy, sw, sh, k, m));
        grab(data.text, false);
      }
    }
  } finally { await w.terminate(); }
  const cnt = {}; reads.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || Math.abs(a.length - 9) - Math.abs(b.length - 9)).slice(0, 8);
}

function withVariants(list) {   // + варианты без задвоенного символа (00 → 0)
  const out = [];
  for (const t of list) {
    out.push(t);
    for (let i = 1; i < t.length; i++) if (t[i] === t[i - 1]) out.push(t.slice(0, i) + t.slice(i + 1));
  }
  return [...new Set(out)].slice(0, 20);
}

function upload() {
  app.innerHTML = `<div class="icon">🛡️</div><h1>Верификация аккаунта</h1>
  <p>Подтверди, что аккаунт Brawl Stars принадлежит тебе</p>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <input type="file" id="f" accept="image/*" class="hidden">
  <button class="drop" id="pick"><b>📷</b>Загрузить скриншот профиля<small>Мы сами найдём твой #ТЕГ</small></button>
  <p id="st"></p>
  <input type="text" id="manual" class="hidden" placeholder="#ТЕГ вручную">
  <button class="btn hidden" id="go">Продолжить</button>`;
  const f = q("f"), st = q("st");
  let found = [];
  q("pick").onclick = () => f.click();
  f.onchange = async () => {
    if (!f.files[0]) return;
    st.textContent = "Распознаём тег…"; st.className = "";
    let err = ""; found = [];
    try { found = await readTags(f.files[0]); } catch (e) { err = " (" + (e.message || e) + ")"; }
    q("manual").value = found[0] ? "#" + found[0] : "";
    st.textContent = found[0] ? "Проверь тег и нажми «Продолжить»" : "Тег не распознан — введи вручную" + err;
    q("manual").classList.remove("hidden"); q("go").classList.remove("hidden");
  };
  q("go").onclick = async () => {
    q("go").disabled = true; st.className = "";
    const raw = q("manual").value.toUpperCase().replace(/^#/, "").replace(/O/g, "0").replace(/[^0289PYLQGRJCUV]/g, "");
    // если тег не правили руками — пробуем все варианты, найденные OCR
    const cands = withVariants(raw === found[0] ? found : [raw]);
    let last;
    for (const t of cands) {
      st.textContent = "Ищем аккаунт…";
      try { return render((await call("start", { tag: t })).player); }
      catch (e) { last = e; if (e.error !== "tag_not_found") break; }
    }
    st.textContent = errText(last || {}); st.className = "err"; q("go").disabled = false;
  };
}

function pending(p) {
  app.innerHTML = `<div class="icon">🔑</div><h1>Подтверди аккаунт</h1>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="found"><div style="font-weight:800;font-size:18px">${p.bs_name}</div><div class="tag">${p.bs_tag}</div></div>
  <p>Зайди в Brawl Stars и <b style="color:var(--or2)">смени аватарку</b> на любую другую. Затем нажми кнопку ниже.</p>
  <button class="btn" id="chk">Я сменил аватарку</button>
  <p id="st"></p><p><a href="#" id="back" style="color:var(--mut)">Другой аккаунт</a></p>`;

function applySnap(sn) {

function tick() {

  const left = Math.max(0, new Date(snap.mine.deadline).getTime() - (Date.now() + off));
  el.textContent = Math.ceil(left / 1000);
  const ring = document.getElementById("ring"); if (ring) ring.style.strokeDashoffset = 565 * (1 - left / total);

const RPC = "https://wlhzcocwgmzcrtzhefic.supabase.co/rest/v1/rpc/tg_do";
async function rpc(action, args = {}) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 25000);
  try {
    const r = await fetch(RPC, { method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
      body: JSON.stringify({ p_init: tg.initData, p_action: action, p_args: args }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw { error: d.message || "rpc_error" };
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw { error: "timeout" };
    if (e instanceof TypeError) throw { error: "network" };
    throw e;
  } finally { clearTimeout(tm); }
}
const eText = e => LERR[e.error] || errText(e);
async function shrink(file) {   // сжимаем скриншот перед отправкой
  const img = await createImageBitmap(file);
  const k = Math.min(1, 1100 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.62);
}
function viewImg(src) {

// ---------- Профиль: график рейтинга и история ----------
const fmtD = d => new Date(d).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }).replace(".", "");
const sgn = n => (n > 0 ? "+" : "") + n;
function fillStats() {
  const w = cur.wins || 0, l = cur.losses || 0, g = w + l;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set("sw", w); set("sl", l); set("sr", g ? Math.round(w / g * 100) + "%" : "—");
}
async function loadProfileHistory() {
  let d = null; try { d = await rpc("history"); } catch (e) {}
  const box = document.getElementById("chbox"), hl = document.getElementById("hlist");
  if (!box || curTab !== "profile") return;
  if (!d) { box.innerHTML = "<p>История пока недоступна.</p>"; return; }
  cur.wins = d.wins; cur.losses = d.losses; fillStats();
  drawChart(box, d.matches);
  hl.innerHTML = d.matches.length ? d.matches.slice().reverse().slice(0, 20).map(m => {
    const w = m.result === "win";
    const dt = new Date(m.created_at).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="mrow"><div class="mres ${w ? "win" : "loss"}">${w ? "Победа" : "Поражение"}</div>
      <div class="minfo"><b>${modeName(m.mode)} · ${m.map || ""}</b><span>vs ${m.opponent || "—"} · ${dt}</span></div>
      <div class="mdelta ${m.delta >= 0 ? "up" : "down"}">${sgn(m.delta)}<small>${m.rating_after}</small></div></div>`;
  }).join("") : "<p>Матчей пока нет.</p>";
}
function drawChart(box, ms) {
  if (!ms.length) { box.innerHTML = "<p>Пока нет матчей — график появится после первой игры.</p>"; return; }
  const W = box.clientWidth || 320, H = 150, pt = 12, pb = 8, n = ms.length;
  const vals = ms.map(m => m.rating_after);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 10; max += 10; }
  const pad = (max - min) * 0.15; min -= pad; max += pad;
  const X = i => n === 1 ? W / 2 : i * (W / (n - 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  const line = "M" + ms.map((m, i) => X(i).toFixed(1) + "," + Y(m.rating_after).toFixed(1)).join(" L");
  const area = line + ` L${X(n - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z`;
  const col = vals[n - 1] >= vals[0] ? "#6ee787" : "#ff6b6b";
  const grid = [0, 1, 2, 3].map(k => { const y = (pt + (H - pt - pb) * k / 3).toFixed(1); return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#222" stroke-width="1"/>`; }).join("");
  box.innerHTML = `<div class="ch-head"><div><b id="chv"></b><span id="chd"></span></div><span id="cht"></span></div>
  <svg id="chsvg" viewBox="0 0 ${W} ${H}" height="${H}">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cl" y1="0" y2="${H}" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle id="cc" r="6" fill="#0d0d0d" stroke="${col}" stroke-width="3"/>
  </svg>
  <div class="ch-foot"><span>${fmtD(ms[0].created_at)}</span><span>${fmtD(ms[n - 1].created_at)}</span></div>`;
  const svg = box.querySelector("#chsvg"), cl = box.querySelector("#cl"), cc = box.querySelector("#cc");
  const set = i => {
    const m = ms[i], x = X(i);
    cl.setAttribute("x1", x); cl.setAttribute("x2", x);
    cc.setAttribute("cx", x); cc.setAttribute("cy", Y(m.rating_after));
    box.querySelector("#chv").textContent = m.rating_after;
    const d = box.querySelector("#chd"); d.textContent = sgn(m.delta); d.className = m.delta >= 0 ? "up" : "down";
    box.querySelector("#cht").textContent = fmtD(m.created_at);
  };
  let drag = false;
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = n === 1 ? 0 : Math.round((e.clientX - r.left) / r.width * (n - 1));
    set(Math.max(0, Math.min(n - 1, i)));
  };
  svg.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener("pointermove", e => { if (drag) move(e); });
  ["pointerup", "pointercancel"].forEach(ev => svg.addEventListener(ev, () => drag = false));
  set(n - 1);
}

  if (curTab !== "admin") return;

async function openGame(id) {

  const ps = g.players.map(p => `<div class="sec" style="margin-top:14px">${p.name} · ${p.tag}</div>
    ${p.img ? `<img class="shot" src="${p.img}" data-v="1" alt="">` : "<p>Скриншот не прикреплён</p>"}`).join("");
  app.innerHTML = `<h1>Игра #${g.id}</h1><p>${g.map} · ставка ${money(g.stake)} · банк ${money(g.stake * 2)}</p>${ps}

  <button class="btn ghost" id="back">← Назад</button>`;
  app.querySelectorAll("[data-v]").forEach(i => i.onclick = () => viewImg(i.src));
  q("back").onclick = () => { app.dataset.adm = "0"; renderAdmin(); };
  app.querySelectorAll("[data-w]").forEach(b => b.onclick = () => {
    const name = g.players.find(p => String(p.tg_id) === b.dataset.w).name;
    const go = async () => {
      try { await rpc("admin_pick", { id, winner: +b.dataset.w }); toast("Победитель выбран, выплата проведена"); }

    };
    const msg = `Победитель: ${name}. Выплатить банк?`;
    tg.showConfirm ? tg.showConfirm(msg, ok => ok && go()) : (confirm(msg) && go());
  });
}

function openTopup() {
  let amount = 300;
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-in">
    <h1>Пополнение</h1><p>Выбери сумму в рублях</p>
    <div class="chips">${[100, 300, 500, 1000].map(a => `<button class="chip${a === 300 ? " on" : ""}" data-a="${a}">${a} ₽</button>`).join("")}</div>
    <input type="text" id="amt" inputmode="numeric" value="300" placeholder="Своя сумма, ₽">
    <p id="tst"></p>
    <button class="btn" id="pay">Перейти к оплате</button>
    <button class="link" id="cls">Отмена</button></div>`;
  document.body.appendChild(el);
  const inp = el.querySelector("#amt"), tst = el.querySelector("#tst");
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    el.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on"); inp.value = c.dataset.a;
  });
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.querySelector("#cls").onclick = () => el.remove();
  el.querySelector("#pay").onclick = async () => {
    amount = parseInt(inp.value.replace(/\D/g, ""), 10);
    if (!amount || amount < 50) { tst.textContent = "Минимальная сумма — 50 ₽"; tst.className = "err"; return; }
    tst.className = ""; tst.textContent = "Создаём счёт…";
    try { const d = await call("topup", { amount }); if (d.url) tg.openInvoice ? tg.openInvoice(d.url) : tg.openLink(d.url); }
    catch (e) { tst.textContent = "Оплата ещё не подключена. Скоро добавим."; tst.className = "err"; }
  };
}

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { if (cur) showTab(b.dataset.t); });

["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault());

function boot() {
  app.innerHTML = "<h1>Загрузка…</h1>";
  call("me").then(d => render(d.player)).catch(e => {
    app.innerHTML = `<div class="icon">⚠️</div><h1>Не удалось загрузить</h1><p class="err">${errText(e)}</p><p style="font-size:12px">${[e.error, e.status, e.detail, e.message].filter(Boolean).join(" · ")}</p><button class="btn" onclick="boot()">Повторить</button>`;
  });
}
boot();
</script>
</body>
</html>
