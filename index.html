<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACEIT · Standoff 2</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }
        body { background:#0b0e14; color:#eee; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
        .container { width:100%; max-width:720px; background:#141a24; border-radius:28px; padding:24px 22px 30px; box-shadow:0 20px 40px rgba(0,0,0,0.8); border:1px solid #2a3340; }
        .header { display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
        .logo { display:flex; align-items:center; gap:8px; }
        .logo svg { width:38px; height:38px; }
        .logo span { font-size:22px; font-weight:700; background:linear-gradient(135deg,#f9a826,#f57c00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .logo small { font-size:12px; font-weight:400; color:#8892a0; background:#1e2633; padding:0 10px; border-radius:30px; -webkit-text-fill-color:#8892a0; line-height:22px; }
        .profile-mini { margin-left:auto; display:flex; align-items:center; gap:10px; background:#1e2633; padding:4px 14px 4px 8px; border-radius:40px; cursor:pointer; transition:0.2s; }
        .profile-mini:hover { background:#2d3848; }
        .avatar-mini { width:34px; height:34px; border-radius:50%; background:#2d3848; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; color:#f9a826; }
        .nick-mini { font-weight:600; font-size:14px; }
        .elo-mini { background:#2d3848; padding:0 12px; border-radius:30px; font-size:13px; font-weight:700; color:#f9a826; line-height:28px; }

        .tabs { display:flex; gap:4px; margin:16px 0 20px; background:#0f151e; padding:4px; border-radius:40px; border:1px solid #1e2633; flex-wrap:wrap; }
        .tab { flex:1; padding:10px 0; text-align:center; font-weight:600; font-size:13px; color:#6a7a8a; border-radius:30px; cursor:pointer; transition:0.2s; background:transparent; border:none; }
        .tab:hover { color:#b0c0d0; }
        .tab.active { background:#f9a826; color:#0b0e14; box-shadow:0 4px 12px rgba(249,168,38,0.3); }
        .tab.active:hover { color:#0b0e14; }

        .tab-content { display:none; animation:fade 0.25s ease; }
        .tab-content.active { display:block; }
        @keyframes fade { from { opacity:0.4; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        .card { background:#0f151e; border-radius:20px; padding:20px; border:1px solid #202a36; margin-bottom:16px; }
        .queue-status { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .queue-label { font-size:18px; font-weight:500; color:#b0c0d0; }
        .queue-count { font-size:28px; font-weight:700; color:#f9a826; background:#1e2633; padding:0 18px; border-radius:40px; line-height:48px; min-width:80px; text-align:center; }
        .progress-bar { height:6px; background:#1e2633; border-radius:10px; overflow:hidden; margin:10px 0 18px; }
        .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#f9a826,#f57c00); transition:width 0.3s ease; border-radius:10px; }
        .btn { width:100%; padding:14px; border:none; border-radius:50px; background:linear-gradient(135deg,#f9a826,#e67e00); color:#0b0e14; font-weight:700; font-size:17px; cursor:pointer; transition:0.2s; box-shadow:0 4px 12px rgba(249,168,38,0.3); }
        .btn:hover:not(:disabled) { transform:scale(1.02); box-shadow:0 6px 20px rgba(249,168,38,0.5); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-reset { background:#2d3848; color:#b0c0d0; box-shadow:none; margin-top:10px; font-size:15px; }
        .btn-reset:hover:not(:disabled) { background:#3d4a5e; }
        .match-found { margin-top:14px; background:#1e3a2a; border:1px solid #2e8b5e; border-radius:40px; padding:12px; text-align:center; color:#8bffb8; font-weight:600; display:none; }
        .match-found.show { display:block; animation:pulse 0.8s ease; }
        @keyframes pulse { 0%{transform:scale(0.95);opacity:0.5;} 50%{transform:scale(1.05);opacity:1;} 100%{transform:scale(1);opacity:1;} }

        /* Профиль */
        .profile-full { display:flex; flex-direction:column; gap:14px; }
        .profile-header { display:flex; align-items:center; gap:18px; }
        .avatar-big { width:72px; height:72px; border-radius:50%; background:#2d3848; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:600; color:#f9a826; border:2px solid #f9a826; }
        .profile-name { font-size:24px; font-weight:700; }
        .profile-name small { font-size:14px; font-weight:400; color:#8892a0; cursor:pointer; border-bottom:1px dashed #4a586a; margin-left:8px; }
        .profile-elo { font-size:28px; font-weight:700; color:#f9a826; margin-top:4px; }
        .stats-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:8px 0 4px; }
        .stat-item { background:#1a222e; border-radius:14px; padding:12px 8px; text-align:center; }
        .stat-item .value { font-size:22px; font-weight:700; color:#f9a826; }
        .stat-item .label { font-size:12px; color:#6a7a8a; margin-top:2px; }
        .stat-item.green .value { color:#8bffb8; }
        .stat-item.red .value { color:#ff6b6b; }

        /* Топ */
        .leaderboard table { width:100%; border-collapse:collapse; }
        .leaderboard th { text-align:left; padding:10px 6px; color:#6a7a8a; font-weight:500; font-size:13px; border-bottom:1px solid #1e2633; }
        .leaderboard td { padding:10px 6px; border-bottom:1px solid #1a222e; font-size:14px; }
        .leaderboard .rank { font-weight:700; color:#f9a826; width:30px; }
        .leaderboard .name { font-weight:600; }
        .leaderboard .elo { font-weight:700; color:#f9a826; text-align:right; }
        .leaderboard .avatar-sm { display:inline-block; width:28px; height:28px; border-radius:50%; background:#2d3848; text-align:center; line-height:28px; font-size:14px; margin-right:8px; }

        /* Матчи */
        .match-list { display:flex; flex-direction:column; gap:10px; }
        .match-item { display:flex; align-items:center; justify-content:space-between; background:#1a222e; padding:12px 16px; border-radius:14px; border-left:4px solid #4a586a; }
        .match-item.win { border-left-color:#2e8b5e; }
        .match-item.lose { border-left-color:#b03a3a; }
        .match-info { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
        .match-map { font-weight:600; font-size:15px; }
        .match-result { font-weight:700; font-size:15px; }
        .match-result.win { color:#8bffb8; }
        .match-result.lose { color:#ff6b6b; }
        .match-elo { color:#8892a0; font-size:13px; }

        /* Админ-панель */
        .admin-login { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
        .admin-login input { flex:1; padding:12px 16px; border-radius:40px; border:1px solid #2a3340; background:#1a222e; color:#eee; font-size:15px; outline:none; min-width:120px; }
        .admin-login input:focus { border-color:#f9a826; }
        .admin-login .btn { flex:0 0 auto; width:auto; padding:12px 24px; }
        .admin-panel table { width:100%; margin-bottom:16px; }
        .admin-panel th { text-align:left; padding:8px 4px; color:#6a7a8a; border-bottom:1px solid #1e2633; }
        .admin-panel td { padding:8px 4px; border-bottom:1px solid #1a222e; }
        .admin-panel select, .admin-panel input { padding:8px 12px; border-radius:30px; border:1px solid #2a3340; background:#1a222e; color:#eee; width:100%; }
        .admin-panel .form-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .admin-panel .form-row > * { flex:1; min-width:100px; }
        .admin-log { background:#1a222e; border-radius:14px; padding:12px; max-height:120px; overflow-y:auto; font-size:13px; color:#8892a0; }
        .admin-log div { padding:4px 0; border-bottom:1px solid #0f151e; }

        .footer-info { display:flex; justify-content:space-between; margin-top:16px; font-size:13px; color:#4a586a; border-top:1px solid #1a222e; padding-top:14px; }
        .footer-info span { background:#1a222e; padding:2px 14px; border-radius:30px; }
        .tip { margin-top:12px; color:#4a586a; font-size:12px; text-align:center; }

        @media (max-width:550px) { .stats-grid { grid-template-columns:1fr 1fr; } .container { padding:16px; } .tabs .tab { font-size:11px; padding:8px 0; } }
    </style>
</head>
<body>
<div class="container">
    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f9a826" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>FACEIT</span>
            <small>SO2</small>
        </div>
        <div class="profile-mini" onclick="switchTab('profile')">
            <div class="avatar-mini" id="miniAvatar">⚡</div>
            <span class="nick-mini" id="miniNick">ProPlayer</span>
            <span class="elo-mini" id="miniElo">1897</span>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="tabs">
        <button class="tab active" data-tab="home">🏠 Главная</button>
        <button class="tab" data-tab="profile">👤 Профиль</button>
        <button class="tab" data-tab="leaderboard">🏆 Топ</button>
        <button class="tab" data-tab="matches">📊 Матчи</button>
        <button class="tab" data-tab="admin">🛡️ Админ</button>
    </div>

    <!-- КОНТЕНТ -->
    <!-- Главная -->
    <div class="tab-content active" id="tab-home">
        <div class="card">
            <div class="queue-status">
                <span class="queue-label">⚔️ Очередь 5×5</span>
                <div class="queue-count" id="queueCounter">0/10</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <button class="btn" id="searchBtn">🔍 Найти матч</button>
            <button class="btn btn-reset" id="resetBtn">⟳ Сбросить</button>
            <div class="match-found" id="matchFound">✅ Матч найден!</div>
        </div>
        <div class="footer-info">
            <span>🏆 ELO: <span id="eloFooter">1897</span></span>
            <span>🕒 Время: <span id="timeDisplay">00:00</span></span>
        </div>
    </div>

    <!-- Профиль -->
    <div class="tab-content" id="tab-profile">
        <div class="card profile-full">
            <div class="profile-header">
                <div class="avatar-big" id="bigAvatar">⚡</div>
                <div>
                    <div class="profile-name" id="profileName">ProPlayer <small onclick="changeNick()">✎ изменить</small></div>
                    <div class="profile-elo" id="profileElo">1897</div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><div class="value" id="gamesPlayed">0</div><div class="label">Игр</div></div>
                <div class="stat-item green"><div class="value" id="wins">0</div><div class="label">Побед</div></div>
                <div class="stat-item red"><div class="value" id="losses">0</div><div class="label">Поражений</div></div>
                <div class="stat-item"><div class="value" id="winrate">0%</div><div class="label">Винрейт</div></div>
                <div class="stat-item"><div class="value" id="kd">0.00</div><div class="label">K/D</div></div>
                <div class="stat-item"><div class="value" id="favMap">-</div><div class="label">Любимая карта</div></div>
            </div>
            <button class="btn" onclick="refreshProfile()" style="background:#2d3848; color:#b0c0d0; box-shadow:none; margin-top:6px;">🔄 Обновить статистику</button>
        </div>
    </div>

    <!-- Топ -->
    <div class="tab-content" id="tab-leaderboard">
        <div class="card leaderboard">
            <table><thead><tr><th>#</th><th>Игрок</th><th>ELO</th><th>Побед</th></tr></thead><tbody id="leaderboardBody"></tbody></table>
        </div>
    </div>

    <!-- Матчи -->
    <div class="tab-content" id="tab-matches">
        <div class="card"><div class="match-list" id="matchList"></div></div>
    </div>

    <!-- Админ-панель -->
    <div class="tab-content" id="tab-admin">
        <div class="card admin-panel">
            <div id="adminLoginBlock" class="admin-login">
                <input type="password" id="adminPassword" placeholder="Введите пароль" value="admin">
                <button class="btn" onclick="adminLogin()" style="width:auto; padding:12px 24px;">Войти</button>
            </div>
            <div id="adminContent" style="display:none;">
                <h3 style="margin-bottom:12px; color:#f9a826;">👑 Управление матчами</h3>
                <table>
                    <thead><tr><th>Игрок</th><th>ELO</th><th>Победы</th></tr></thead>
                    <tbody id="adminPlayerTable"></tbody>
                </table>
                <div style="margin:16px 0; border-top:1px solid #1e2633; padding-top:16px;">
                    <h4 style="margin-bottom:10px; color:#b0c0d0;">Засчитать матч</h4>
                    <div class="form-row">
