<html lang="ru">
<head>

<style>
:root{--bg:#0a0a0a;--card:#141414;--or:#ff7a00;--or2:#ffa040;--tx:#f5f5f5;--mut:#8f8f8f}
*{box-sizing:border-box;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(rgba(255,122,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,0,.08) 1px,transparent 1px);background-size:28px 28px;background-position:center top;color:var(--tx);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:80px 20px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--or);text-align:center;opacity:.95}
.brand span{color:var(--mut)}
.card{position:relative;background:linear-gradient(180deg,#191919,#101010);border:1px solid rgba(255,122,0,.25);border-radius:26px;padding:30px 22px 24px;width:100%;max-width:400px;text-align:center;margin-top:18px;box-shadow:0 0 0 1px #000,0 18px 50px rgba(0,0,0,.65),0 0 60px rgba(255,122,0,.10)}
.card::before{content:"";position:absolute;left:20%;right:20%;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--or),transparent);border-radius:2px}
.icon{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 30% 25%,#ffb066,var(--or) 60%,#c85a00);box-shadow:0 0 28px rgba(255,122,0,.45)}
h1{color:var(--tx);font-size:22px;font-weight:800;margin-bottom:6px}
p{color:var(--mut);font-size:14px;line-height:1.55;margin:8px 0}
.steps{display:flex;justify-content:center;gap:8px;margin:16px 0 4px}
.steps i{width:30px;height:4px;border-radius:4px;background:#2c2c2c}
.steps i.on{background:linear-gradient(90deg,var(--or),var(--or2));box-shadow:0 0 8px rgba(255,122,0,.6)}
.btn{background:linear-gradient(135deg,var(--or),var(--or2));color:#111;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;width:100%;margin-top:16px;cursor:pointer;box-shadow:0 6px 20px rgba(255,122,0,.3);transition:transform .1s}
.btn:active{transform:scale(.97)}

.drop{display:block;width:100%;margin-top:18px;padding:26px 14px;border:2px dashed rgba(255,122,0,.45);border-radius:18px;background:rgba(255,122,0,.05);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}

.badge{display:inline-block;background:rgba(255,122,0,.1);color:var(--or2);border:1px solid rgba(255,122,0,.5);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;margin-top:12px}

.found .tag{font-size:18px}
input[type=text]{width:100%;background:#0c0c0c;border:1px solid #2e2e2e;color:var(--tx);border-radius:12px;padding:14px;margin-top:14px;font-size:18px;font-weight:700;letter-spacing:1px;text-align:center;outline:0}

.err{color:#ff6b6b}
.hidden{display:none}
body.shell{justify-content:flex-start;padding-top:90px;padding-bottom:120px}
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;display:flex;gap:4px;padding:8px;background:rgba(18,18,18,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,122,0,.3);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 30px rgba(255,122,0,.1)}

.ico svg{width:34px;height:34px;fill:none;stroke:#111;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

html{touch-action:manipulation;-webkit-text-size-adjust:100%}

input{-webkit-user-select:text;user-select:text}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.stat{background:#0d0d0d;border:1px solid #262626;border-radius:16px;padding:14px 4px}

.stat span{display:block;color:var(--mut);font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.stat.w b{color:#4cd964}.stat.l b{color:#ff6b6b}.stat.r b{color:var(--or)}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;background:linear-gradient(135deg,rgba(255,122,0,.16),rgba(255,122,0,.04));border:1px solid rgba(255,122,0,.35);border-radius:18px;padding:14px 16px;text-align:left}
.wallet span{display:block;color:var(--mut);font-size:12px}
.wallet b{font-size:24px;font-weight:800}
.wallet .btn{width:auto;margin:0;padding:11px 16px;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet-in{width:100%;max-width:440px;background:#141414;border:1px solid rgba(255,122,0,.3);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.chip{background:#0d0d0d;border:1px solid #2e2e2e;color:var(--tx);border-radius:12px;padding:12px 0;font-weight:700;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--or);color:var(--or);background:rgba(255,122,0,.1)}
.link{background:none;border:0;color:var(--mut);margin-top:12px;font-size:14px;cursor:pointer}
.chart{margin-top:12px;background:#0d0d0d;border:1px solid #262626;border-radius:18px;padding:16px 14px 12px;text-align:left}
.ch-title{font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:800;text-transform:uppercase}
.ch-head{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px}
#chv{font-size:30px;font-weight:800}#chd{font-weight:800;font-size:15px;margin-left:8px}#cht{color:var(--mut);font-size:13px}
#chsvg{display:block;width:100%;touch-action:pan-y;cursor:ew-resize}
.ch-foot{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px}
.up{color:#6ee787}.down{color:#ff6b6b}
.mlist{text-align:left;margin-top:14px}
.mrow{display:flex;align-items:center;gap:12px;background:#0d0d0d;border:1px solid #262626;border-radius:14px;padding:12px;margin-top:8px}
.mres{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:8px;padding:6px 8px;min-width:84px;text-align:center}
.mres.win{background:rgba(110,231,135,.12);color:#6ee787;border:1px solid rgba(110,231,135,.35)}
.mres.loss{background:rgba(255,107,107,.12);color:#ff6b6b;border:1px solid rgba(255,107,107,.35)}
.minfo{flex:1}.minfo b{display:block;font-size:14px}.minfo span{color:var(--mut);font-size:12px}
.mdelta{text-align:right;font-weight:800;font-size:16px}.mdelta small{display:block;color:var(--mut);font-weight:600;font-size:11px}
</style>

<body>
<div class="brand">StartUp <span>—</span> Brawl Stars</div>
<div id="app" class="card"><h1>Загрузка…</h1></div>

<nav id="nav" class="hidden">
  <button data-t="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Профиль</button>
  <button data-t="matches"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Матчи</button>
  <button data-t="top"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4"/><path d="M12 13v4M10 17h4M8 21h8"/></svg>Топ</button>
</nav>
<script>
// ВСТАВЬ после деплоя функции:
const API = "https://wlhzcocwgmzcrtzhefic.supabase.co/functions/v1/api";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsaHpjb2N3Z216Y3J0emhlZmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzQ4ODYsImV4cCI6MjEwNjQ1MDg4Nn0.-Y1jYFT1NO9Nm1SgzNU7QYBA1E8zTZr8aXA768-5cd8";

const tg = Telegram.WebApp; tg.ready(); tg.expand();
tg.setHeaderColor("#0d0d0d"); tg.setBackgroundColor("#0d0d0d");
const app = document.getElementById("app");
const tgUser = tg.initDataUnsafe.user || {};
const ava = tgUser.photo_url || "";

async function call(action, extra = {}) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 15000);
  try {
    const r = await fetch(API, { method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
      body: JSON.stringify({ action, initData: tg.initData, ...extra }) });
    let d = {}; try { d = await r.json(); } catch (_) { d = { error: "http_" + r.status }; }
    if (!r.ok) { d.status = d.status || r.status; throw d; }
    return d;
  } catch (e) {
    if (e.name === "AbortError") throw { error: "timeout" };
    if (e instanceof TypeError) throw { error: "network", detail: e.message };
    throw e;
  } finally { clearTimeout(tm); }
}
const errText = e => ({ tag_not_found: "Тег не найден", tag_taken: "Этот аккаунт уже привязан", bad_auth: "Открой приложение из Telegram", timeout: "Сервер не отвечает (таймаут)", network: "Нет связи с сервером" }[e.error] || "Ошибка, попробуй ещё раз");

function render(p) {
  const v = p.status === "verified";
  document.body.classList.toggle("shell", v);
  document.getElementById("nav").classList.toggle("hidden", !v);
  if (p.status === "verified") return profile(p);
  if (p.status === "pending") return pending(p);
  return upload();
}


const WL = "#0289PYLQGRJCUVO";
function makeCanvas(img, sx, sy, sw, sh, k, mode) {
  const c = document.createElement("canvas");
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    if (mode === "t100") v = v > 100 ? 255 : 0;
    if (mode === "t90inv") v = v > 90 ? 0 : 255;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  return c;
}

// Возвращает список вероятных тегов (самый частый — первый)
async function readTags(file) {
  const img = await createImageBitmap(file);
  const reads = [];
  const grab = (t, strict) => {
    const re = strict ? /#\s*([0289PYLQGRJCUVO]{5,11})/g : /([0289PYLQGRJCUVO]{6,11})/g;
    for (const m of t.toUpperCase().matchAll(re)) reads.push(m[1].replace(/O/g, "0"));
  };
  const w = await Tesseract.createWorker("eng");
  try {
    await w.setParameters({ tessedit_char_whitelist: WL, tessedit_pageseg_mode: "11" });
    const sc = img.width < 1500 ? 1500 / img.width : 1;
    let box = null;
    for (const m of ["gray", "t100", "t90inv"]) {
      const { data } = await w.recognize(makeCanvas(img, 0, 0, img.width, img.height, sc, m));
      grab(data.text, true);
      if (!box) { const wd = (data.words || []).find(q => q.text.includes("#")); if (wd) box = wd.bbox; }
    }
    if (box) {   // повторное чтение только строки с тегом, крупно
      await w.setParameters({ tessedit_pageseg_mode: "7" });
      const h = box.y1 - box.y0, pad = h * 0.6;
      const sx = Math.max(0, (box.x0 - pad) / sc), sy = Math.max(0, (box.y0 - pad) / sc);
      const sw = Math.min(img.width - sx, (box.x1 - box.x0 + 2 * pad) / sc), sh = Math.min(img.height - sy, (h + 2 * pad) / sc);
      for (const m of ["gray", "t90inv", "t100"]) for (const k of [3, 4]) {
        const { data } = await w.recognize(makeCanvas(img, sx, sy, sw, sh, k, m));
        grab(data.text, false);
      }
    }
  } finally { await w.terminate(); }
  const cnt = {}; reads.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || Math.abs(a.length - 9) - Math.abs(b.length - 9)).slice(0, 8);
}

function withVariants(list) {   // + варианты без задвоенного символа (00 → 0)
  const out = [];
  for (const t of list) {
    out.push(t);
    for (let i = 1; i < t.length; i++) if (t[i] === t[i - 1]) out.push(t.slice(0, i) + t.slice(i + 1));
  }
  return [...new Set(out)].slice(0, 20);
}

function upload() {
  app.innerHTML = `<div class="icon">🛡️</div><h1>Верификация аккаунта</h1>
  <p>Подтверди, что аккаунт Brawl Stars принадлежит тебе</p>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <input type="file" id="f" accept="image/*" class="hidden">
  <button class="drop" id="pick"><b>📷</b>Загрузить скриншот профиля<small>Мы сами найдём твой #ТЕГ</small></button>
  <p id="st"></p>
  <input type="text" id="manual" class="hidden" placeholder="#ТЕГ вручную">
  <button class="btn hidden" id="go">Продолжить</button>`;
  const f = q("f"), st = q("st");
  let found = [];
  q("pick").onclick = () => f.click();
  f.onchange = async () => {
    if (!f.files[0]) return;
    st.textContent = "Распознаём тег…"; st.className = "";
    let err = ""; found = [];
    try { found = await readTags(f.files[0]); } catch (e) { err = " (" + (e.message || e) + ")"; }
    q("manual").value = found[0] ? "#" + found[0] : "";
    st.textContent = found[0] ? "Проверь тег и нажми «Продолжить»" : "Тег не распознан — введи вручную" + err;
    q("manual").classList.remove("hidden"); q("go").classList.remove("hidden");
  };
  q("go").onclick = async () => {
    q("go").disabled = true; st.className = "";
    const raw = q("manual").value.toUpperCase().replace(/^#/, "").replace(/O/g, "0").replace(/[^0289PYLQGRJCUV]/g, "");
    // если тег не правили руками — пробуем все варианты, найденные OCR
    const cands = withVariants(raw === found[0] ? found : [raw]);
    let last;
    for (const t of cands) {
      st.textContent = "Ищем аккаунт…";
      try { return render((await call("start", { tag: t })).player); }
      catch (e) { last = e; if (e.error !== "tag_not_found") break; }
    }
    st.textContent = errText(last || {}); st.className = "err"; q("go").disabled = false;
  };
}

function pending(p) {
  app.innerHTML = `<div class="icon">🔑</div><h1>Подтверди аккаунт</h1>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="found"><div style="font-weight:800;font-size:18px">${p.bs_name}</div><div class="tag">${p.bs_tag}</div></div>
  <p>Зайди в Brawl Stars и <b style="color:var(--or2)">смени аватарку</b> на любую другую. Затем нажми кнопку ниже.</p>
  <button class="btn" id="chk">Я сменил аватарку</button>
  <p id="st"></p><p><a href="#" id="back" style="color:var(--mut)">Другой аккаунт</a></p>`;
  q("chk").onclick = async () => {
    q("chk").disabled = true; q("st").textContent = "Проверяем…";
    try {
      const d = await call("check");
      if (d.player.status === "verified") return render(d.player);
      q("st").textContent = "Аватарка не изменилась. Подожди ~30 сек после смены и попробуй снова."; q("st").className = "err";
    } catch (e) { q("st").textContent = errText(e); q("st").className = "err"; }
    q("chk").disabled = false;
  };
  q("back").onclick = e => { e.preventDefault(); upload(); };
}

const ICONS = {
  matches: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>',
  top: '<svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4"/><path d="M12 13v4M10 17h4M8 21h8"/></svg>'
};
let curTab = "profile", cur = null;
function profile(p) { cur = p; showTab(curTab); }
function showTab(t) {
  curTab = t;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  if (t === "matches") { renderMatches(); return; }
  if (t === "top") {
    const title = t === "matches" ? "Матчи" : "Топ игроков";
    const text = t === "matches" ? "Здесь появятся твои матчи и результаты." : "Здесь будет рейтинг лучших игроков платформы.";
    app.innerHTML = `<div class="icon ico">${ICONS[t]}</div><h1>${title}</h1><p>${text}</p><span class="soon">Скоро</span>`;
    return;
  }
  const w = cur.wins || 0, l = cur.losses || 0, g = w + l;
  const wr = g ? Math.round(w / g * 100) + "%" : "—";
  const bal = Number(cur.balance || 0).toLocaleString("ru-RU");
  app.innerHTML = `<img class="ava" src="${ava || cur.tg_photo_url || ""}" alt="">
  <div class="nick">${cur.bs_name}</div>
  <p class="tag">${cur.bs_tag}</p>
  <span class="badge">✔ Аккаунт подтверждён</span>
  <div class="stats">
    <div class="stat w"><b>${w}</b><span>Победы</span></div>
    <div class="stat l"><b>${l}</b><span>Поражения</span></div>
    <div class="stat r"><b>${wr}</b><span>Винрейт</span></div>
  </div>
  <div class="wallet"><div><span>Баланс</span><b>${bal} ₽</b></div><button class="btn" id="topup">＋ Пополнить</button></div>
  <div class="chart"><div class="ch-title">История рейтинга</div><div id="chbox"><p>Загрузка…</p></div></div>`;
  q("topup").onclick = openTopup;
  loadHist().then(ms => { const b = document.getElementById("chbox"); if (b && curTab === "profile") drawChart(b, ms); });
}

const q = id => document.getElementById(id);

async function loadHist() {
  try { return (await call("history")).matches || []; } catch (e) { return null; }
}
const fmtD = d => new Date(d).toLocaleDateString("ru-RU", { day: "numeric", month: "short" }).replace(".", "");
const sgn = n => (n > 0 ? "+" : "") + n;

function drawChart(box, ms) {
  if (ms === null) { box.innerHTML = "<p>История недоступна. Обнови функцию api и SQL.</p>"; return; }
  if (!ms.length) { box.innerHTML = "<p>Пока нет матчей — график появится после первой игры.</p>"; return; }
  const W = box.clientWidth || 320, H = 150, pt = 12, pb = 8, n = ms.length;
  const vals = ms.map(m => m.rating_after);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 10; max += 10; }
  const pad = (max - min) * 0.15; min -= pad; max += pad;
  const X = i => n === 1 ? W / 2 : i * (W / (n - 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - min) / (max - min));
  const line = "M" + ms.map((m, i) => X(i).toFixed(1) + "," + Y(m.rating_after).toFixed(1)).join(" L");
  const area = line + ` L${X(n - 1).toFixed(1)},${H} L${X(0).toFixed(1)},${H} Z`;
  const col = vals[n - 1] >= vals[0] ? "#6ee787" : "#ff6b6b";
  const grid = [0, 1, 2, 3].map(k => { const y = (pt + (H - pt - pb) * k / 3).toFixed(1); return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#222" stroke-width="1"/>`; }).join("");
  box.innerHTML = `<div class="ch-head"><div><b id="chv"></b><span id="chd"></span></div><span id="cht"></span></div>
  <svg id="chsvg" viewBox="0 0 ${W} ${H}" height="${H}">
    <defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#gf)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="cl" y1="0" y2="${H}" stroke="rgba(255,255,255,.45)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle id="cc" r="6" fill="#0d0d0d" stroke="${col}" stroke-width="3"/>
  </svg>
  <div class="ch-foot"><span>${fmtD(ms[0].created_at)}</span><span>${fmtD(ms[n - 1].created_at)}</span></div>`;
  const svg = box.querySelector("#chsvg"), cl = box.querySelector("#cl"), cc = box.querySelector("#cc");
  const set = i => {
    const m = ms[i], x = X(i);
    cl.setAttribute("x1", x); cl.setAttribute("x2", x);
    cc.setAttribute("cx", x); cc.setAttribute("cy", Y(m.rating_after));
    box.querySelector("#chv").textContent = m.rating_after;
    const d = box.querySelector("#chd"); d.textContent = sgn(m.delta); d.className = m.delta >= 0 ? "up" : "down";
    box.querySelector("#cht").textContent = fmtD(m.created_at);
  };
  let drag = false;
  const move = e => {
    const r = svg.getBoundingClientRect();
    const i = n === 1 ? 0 : Math.round((e.clientX - r.left) / r.width * (n - 1));
    set(Math.max(0, Math.min(n - 1, i)));
  };
  svg.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); move(e); });
  svg.addEventListener("pointermove", e => { if (drag) move(e); });
  ["pointerup", "pointercancel"].forEach(ev => svg.addEventListener(ev, () => drag = false));
  set(n - 1);
}

async function renderMatches() {
  app.innerHTML = `<div class="icon ico">${ICONS.matches}</div><h1>История матчей</h1><p>Загрузка…</p>`;
  const ms = await loadHist();
  if (curTab !== "matches") return;
  const head = `<div class="icon ico">${ICONS.matches}</div><h1>История матчей</h1>`;
  if (ms === null) { app.innerHTML = head + "<p>История недоступна. Обнови функцию api и SQL.</p>"; return; }
  if (!ms.length) { app.innerHTML = head + '<p>Матчей пока нет.</p><span class="soon">Сыграй первый</span>'; return; }
  const rows = ms.slice().reverse().slice(0, 50).map(m => {
    const w = m.result === "win";
    const dt = new Date(m.created_at).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="mrow"><div class="mres ${w ? "win" : "loss"}">${w ? "Победа" : "Поражение"}</div>
      <div class="minfo"><b>${m.mode}</b><span>${dt}</span></div>
      <div class="mdelta ${m.delta >= 0 ? "up" : "down"}">${sgn(m.delta)}<small>${m.rating_after}</small></div></div>`;
  }).join("");
  app.innerHTML = head + `<div class="mlist">${rows}</div>`;
}

function openTopup() {
  let amount = 300;
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="sheet-in">
    <h1>Пополнение</h1><p>Выбери сумму в рублях</p>
    <div class="chips">${[100, 300, 500, 1000].map(a => `<button class="chip${a === 300 ? " on" : ""}" data-a="${a}">${a} ₽</button>`).join("")}</div>
    <input type="text" id="amt" inputmode="numeric" value="300" placeholder="Своя сумма, ₽">
    <p id="tst"></p>
    <button class="btn" id="pay">Перейти к оплате</button>
    <button class="link" id="cls">Отмена</button></div>`;
  document.body.appendChild(el);
  const inp = el.querySelector("#amt"), tst = el.querySelector("#tst");
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    el.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); c.classList.add("on"); inp.value = c.dataset.a;
  });
  el.onclick = e => { if (e.target === el) el.remove(); };
  el.querySelector("#cls").onclick = () => el.remove();
  el.querySelector("#pay").onclick = async () => {
    amount = parseInt(inp.value.replace(/\D/g, ""), 10);
    if (!amount || amount < 50) { tst.textContent = "Минимальная сумма — 50 ₽"; tst.className = "err"; return; }
    tst.className = ""; tst.textContent = "Создаём счёт…";
    try { const d = await call("topup", { amount }); if (d.url) tg.openInvoice ? tg.openInvoice(d.url) : tg.openLink(d.url); }
    catch (e) { tst.textContent = "Оплата ещё не подключена. Скоро добавим."; tst.className = "err"; }
  };
}

document.querySelectorAll("#nav button").forEach(b => b.onclick = () => { if (cur) showTab(b.dataset.t); });

["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault());

function boot() {
  app.innerHTML = "<h1>Загрузка…</h1>";
  call("me").then(d => render(d.player)).catch(e => {
    app.innerHTML = `<div class="icon">⚠️</div><h1>Не удалось загрузить</h1><p class="err">${errText(e)}</p><p style="font-size:12px">${[e.error, e.status, e.detail, e.message].filter(Boolean).join(" · ")}</p><button class="btn" onclick="boot()">Повторить</button>`;
  });
}
boot();
</script>
