<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест регистрации</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a24;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #333;
        }
        .container h1 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 5px;
        }
        .container .sub {
            text-align: center;
            color: #888;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        .container input:focus {
            outline: none;
            border-color: #ffd700;
        }
        .container button {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .container button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .container .msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .container .msg.show {
            display: block;
        }
        .container .msg.success {
            background: rgba(81, 207, 102, 0.2);
            color: #51cf66;
        }
        .container .msg.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        .container .msg.info {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        .container .links {
            text-align: center;
            margin-top: 15px;
            color: #888;
        }
        .container .links a {
            color: #ffd700;
            cursor: pointer;
            text-decoration: none;
        }
        .container .links a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none !important;
        }
        .success-block {
            text-align: center;
            padding: 20px 0;
        }
        .success-block .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ffd700;
            color: #000;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: 900;
        }
        .success-block h2 {
            color: #fff;
            margin-bottom: 5px;
        }
        .success-block p {
            color: #888;
        }
        .success-block button {
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h1>⚡ Brawl Stars</h1>
        <div class="sub">Тест регистрации</div>

        <!-- Форма входа -->
        <div id="loginBlock">
            <h2 style="text-align:center;margin-bottom:15px;font-size:18px;">Вход</h2>
            <input type="text" id="loginUsername" placeholder="Имя пользователя">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button id="loginBtn">Войти</button>
            <div class="links">
                <a id="showRegisterLink">Нет аккаунта? Зарегистрироваться</a>
            </div>
            <div class="msg" id="loginMsg"></div>
        </div>

        <!-- Форма регистрации -->
        <div id="registerBlock" class="hidden">
            <h2 style="text-align:center;margin-bottom:15px;font-size:18px;">Регистрация</h2>
            <input type="text" id="regUsername" placeholder="Имя пользователя">
            <input type="password" id="regPassword" placeholder="Пароль (мин. 8 символов)">
            <input type="password" id="regPasswordConfirm" placeholder="Подтвердите пароль">
            <button id="registerBtn">Зарегистрироваться</button>
            <div class="links">
                <a id="showLoginLink">Уже есть аккаунт? Войти</a>
            </div>
            <div class="msg" id="registerMsg"></div>
        </div>

        <!-- Блок успешного входа -->
        <div id="welcomeBlock" class="hidden">
            <div class="success-block">
                <div class="avatar" id="userAvatar">?</div>
                <h2 id="userName">Игрок</h2>
                <p>Вы успешно вошли в систему!</p>
                <button id="logoutBtn">Выйти</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ПРОСТЕЙШИЙ ТЕСТОВЫЙ СКРИПТ
        // ============================================================

        console.log('🚀 СКРИПТ ЗАПУЩЕН!');

        // ===== SUPABASE =====
        const supabaseUrl = 'https://txokbboyhytmiurijvyh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4b2tiYm95aHl0bWl1cmlqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzE4MjksImV4cCI6MjEwMDY0NzgyOX0.L5jASUIzGizBBo364mUqmsiWKUAHeVUUvLN4Yuttees';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        console.log('✅ Supabase инициализирован');

        // ===== ПЕРЕМЕННЫЕ =====
        let currentUser = null;

        // ============================================================
        //  ФУНКЦИЯ ПОКАЗА СООБЩЕНИЯ
        // ============================================================
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = 'msg show ' + type;
            console.log('📝 Сообщение:', type, text);
        }

        function hideMessage(elementId) {
            const el = document.getElementById(elementId);
            el.className = 'msg';
            el.textContent = '';
        }

        // ============================================================
        //  РЕГИСТРАЦИЯ
        // ============================================================
        async function registerUser() {
            console.log('🔵 РЕГИСТРАЦИЯ: НАЧАТА!');

            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;

            console.log('📝 Данные:', { username, passwordLength: password ? password.length : 0 });

            if (!username || !password || !confirm) {
                showMessage('registerMsg', '❌ Заполните все поля', 'error');
                return;
            }
            if (password !== confirm) {
                showMessage('registerMsg', '❌ Пароли не совпадают', 'error');
                return;
            }
            if (password.length < 8) {
                showMessage('registerMsg', '❌ Пароль минимум 8 символов', 'error');
                return;
            }

            showMessage('registerMsg', '⏳ Проверяем данные...', 'info');

            try {
                console.log('🔍 Проверяем существование пользователя...');

                const { data: existing, error: checkError } = await supabase
                    .from('users')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();

                if (checkError) {
                    console.error('❌ Ошибка проверки:', checkError);
                    showMessage('registerMsg', '❌ Ошибка проверки: ' + checkError.message, 'error');
                    return;
                }

                if (existing) {
                    console.log('❌ Пользователь уже существует');
                    showMessage('registerMsg', '❌ Имя пользователя уже занято', 'error');
                    return;
                }

                console.log('👤 Создаём пользователя...');

                const { data, error } = await supabase
                    .from('users')
                    .insert([{
                        username: username,
                        password: password,
                        reg_date: new Date().toLocaleDateString('ru-RU'),
                        elo: 0,
                        wins: 0,
                        losses: 0,
                        matches: 0,
                        mvp: 0,
                        party_code: 'ABCDEF'
                    }])
                    .select()
                    .single();

                if (error) {
                    console.error('❌ Ошибка создания:', error);
                    showMessage('registerMsg', '❌ Ошибка: ' + error.message, 'error');
                    return;
                }

                console.log('✅ Пользователь создан:', data);
                currentUser = data;
                showMessage('registerMsg', '✅ Успешно! Добро пожаловать, ' + username, 'success');

                setTimeout(function() {
                    showWelcomeScreen();
                }, 1000);

            } catch (e) {
                console.error('❌ Критическая ошибка:', e);
                showMessage('registerMsg', '❌ Ошибка: ' + e.message, 'error');
            }
        }

        // ============================================================
        //  ВХОД
        // ============================================================
        async function loginUser() {
            console.log('🔵 ВХОД: НАЧАТ!');

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            console.log('📝 Данные:', { username });

            if (!username || !password) {
                showMessage('loginMsg', '❌ Заполните все поля', 'error');
                return;
            }

            showMessage('loginMsg', '⏳ Ищем пользователя...', 'info');

            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .maybeSingle();

                if (error) {
                    console.error('❌ Ошибка входа:', error);
                    showMessage('loginMsg', '❌ Ошибка: ' + error.message, 'error');
                    return;
                }

                if (!data) {
                    console.log('❌ Пользователь не найден');
                    showMessage('loginMsg', '❌ Неверное имя или пароль', 'error');
                    return;
                }

                console.log('✅ Пользователь найден:', data);
                currentUser = data;
                showMessage('loginMsg', '✅ Добро пожаловать, ' + username, 'success');

                setTimeout(function() {
                    showWelcomeScreen();
                }, 1000);

            } catch (e) {
                console.error('❌ Критическая ошибка:', e);
                showMessage('loginMsg', '❌ Ошибка: ' + e.message, 'error');
            }
        }

        // ============================================================
        //  ПОКАЗ ЭКРАНА ПРИВЕТСТВИЯ
        // ============================================================
        function showWelcomeScreen() {
            document.getElementById('loginBlock').classList.add('hidden');
            document.getElementById('registerBlock').classList.add('hidden');
            document.getElementById('welcomeBlock').classList.remove('hidden');

            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
        }

        // ============================================================
        //  ВЫХОД
        // ============================================================
        function logoutUser() {
            currentUser = null;
            document.getElementById('loginBlock').classList.remove('hidden');
            document.getElementById('registerBlock').classList.add('hidden');
            document.getElementById('welcomeBlock').classList.add('hidden');
            hideMessage('loginMsg');
            hideMessage('registerMsg');
            console.log('🔴 Выход выполнен');
        }

        // ============================================================
        //  ПЕРЕКЛЮЧЕНИЕ ФОРМ
        // ============================================================
        function showRegisterForm() {
            document.getElementById('loginBlock').classList.add('hidden');
            document.getElementById('registerBlock').classList.remove('hidden');
            hideMessage('loginMsg');
            hideMessage('registerMsg');
            console.log('🔄 Переключено на регистрацию');
        }

        function showLoginForm() {
            document.getElementById('loginBlock').classList.remove('hidden');
            document.getElementById('registerBlock').classList.add('hidden');
            hideMessage('loginMsg');
            hideMessage('registerMsg');
            console.log('🔄 Переключено на вход');
        }

        // ============================================================
        //  ПОДКЛЮЧЕНИЕ ОБРАБОТЧИКОВ
        // ============================================================
        console.log('📌 Подключаем обработчики...');

        // Регистрация
        const registerBtn = document.getElementById('registerBtn');
        if (registerBtn) {
            registerBtn.onclick = registerUser;
            console.log('✅ Кнопка регистрации подключена');
        } else {
            console.error('❌ Кнопка registerBtn не найдена!');
        }

        // Вход
        const loginBtn = document.getElementById('loginBtn');
        if (loginBtn) {
            loginBtn.onclick = loginUser;
            console.log('✅ Кнопка входа подключена');
        } else {
            console.error('❌ Кнопка loginBtn не найдена!');
        }

        // Переключение на регистрацию
        const showRegisterLink = document.getElementById('showRegisterLink');
        if (showRegisterLink) {
            showRegisterLink.onclick = function(e) {
                e.preventDefault();
                showRegisterForm();
            };
            console.log('✅ Ссылка на регистрацию подключена');
        }

        // Переключение на вход
        const showLoginLink = document.getElementById('showLoginLink');
        if (showLoginLink) {
            showLoginLink.onclick = function(e) {
                e.preventDefault();
                showLoginForm();
            };
            console.log('✅ Ссылка на вход подключена');
        }

        // Выход
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.onclick = logoutUser;
            console.log('✅ Кнопка выхода подключена');
        }

        console.log('✅ ВСЕ ОБРАБОТЧИКИ ПОДКЛЮЧЕНЫ!');
        console.log('✅ ГОТОВО! ЖДУ ДЕЙСТВИЙ...');
    </script>

</body>
</html>
