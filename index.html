<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StartUp — Brawl Stars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#141414;--or:#ff7a00;--or2:#ffa040;--tx:#f5f5f5;--mut:#8f8f8f}
*{box-sizing:border-box;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(rgba(255,122,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,122,0,.08) 1px,transparent 1px);background-size:28px 28px;background-position:center top;color:var(--tx);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:80px 20px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--or);text-align:center;opacity:.95}
.brand span{color:var(--mut)}
.card{position:relative;background:linear-gradient(180deg,#191919,#101010);border:1px solid rgba(255,122,0,.25);border-radius:26px;padding:30px 22px 24px;width:100%;max-width:400px;text-align:center;margin-top:18px;box-shadow:0 0 0 1px #000,0 18px 50px rgba(0,0,0,.65),0 0 60px rgba(255,122,0,.10)}
.card::before{content:"";position:absolute;left:20%;right:20%;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--or),transparent);border-radius:2px}
.icon{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 30% 25%,#ffb066,var(--or) 60%,#c85a00);box-shadow:0 0 28px rgba(255,122,0,.45)}
h1{color:var(--tx);font-size:22px;font-weight:800;margin-bottom:6px}
p{color:var(--mut);font-size:14px;line-height:1.55;margin:8px 0}
.steps{display:flex;justify-content:center;gap:8px;margin:16px 0 4px}
.steps i{width:30px;height:4px;border-radius:4px;background:#2c2c2c}
.steps i.on{background:linear-gradient(90deg,var(--or),var(--or2));box-shadow:0 0 8px rgba(255,122,0,.6)}
.btn{background:linear-gradient(135deg,var(--or),var(--or2));color:#111;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;width:100%;margin-top:16px;cursor:pointer;box-shadow:0 6px 20px rgba(255,122,0,.3);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.drop{display:block;width:100%;margin-top:18px;padding:26px 14px;border:2px dashed rgba(255,122,0,.45);border-radius:18px;background:rgba(255,122,0,.05);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer}
.drop small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:6px}
.drop b{display:block;font-size:30px;margin-bottom:6px}
.ava{width:116px;height:116px;border-radius:50%;border:3px solid var(--or);object-fit:cover;background:#222;box-shadow:0 0 30px rgba(255,122,0,.45)}
.nick{font-size:26px;font-weight:800;margin-top:16px}
.tag{color:var(--or);font-weight:700;letter-spacing:.5px}
.badge{display:inline-block;background:rgba(255,122,0,.1);color:var(--or2);border:1px solid rgba(255,122,0,.5);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;margin-top:12px}
.found{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:14px;padding:12px;margin-top:14px}
.found .tag{font-size:18px}
input[type=text]{width:100%;background:#0c0c0c;border:1px solid #2e2e2e;color:var(--tx);border-radius:12px;padding:14px;margin-top:14px;font-size:18px;font-weight:700;letter-spacing:1px;text-align:center;outline:0}
input[type=text]:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(255,122,0,.15)}
.err{color:#ff6b6b}
.hidden{display:none}
</style>
</head>
<body>
<div class="brand">StartUp <span>—</span> Brawl Stars</div>
<div id="app" class="card"><h1>Загрузка…</h1></div>

<script>
// ВСТАВЬ после деплоя функции:
const API = "https://wlhzcocwgmzcrtzhefic.supabase.co/functions/v1/api";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsaHpjb2N3Z216Y3J0emhlZmljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzQ4ODYsImV4cCI6MjEwNjQ1MDg4Nn0.-Y1jYFT1NO9Nm1SgzNU7QYBA1E8zTZr8aXA768-5cd8";

const tg = Telegram.WebApp; tg.ready(); tg.expand();
tg.setHeaderColor("#0d0d0d"); tg.setBackgroundColor("#0d0d0d");
const app = document.getElementById("app");
const tgUser = tg.initDataUnsafe.user || {};
const ava = tgUser.photo_url || "";

async function call(action, extra = {}) {
  const r = await fetch(API, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: ANON, Authorization: "Bearer " + ANON },
    body: JSON.stringify({ action, initData: tg.initData, ...extra }) });
  const d = await r.json(); if (!r.ok) throw d; return d;
}
const errText = e => ({ tag_not_found: "Тег не найден", tag_taken: "Этот аккаунт уже привязан", bad_auth: "Открой приложение из Telegram" }[e.error] || "Ошибка, попробуй ещё раз");

function render(p) {
  if (p.status === "verified") return profile(p);
  if (p.status === "pending") return pending(p);
  return upload();
}


const WL = "#0289PYLQGRJCUVO";
function makeCanvas(img, sx, sy, sw, sh, k, mode) {
  const c = document.createElement("canvas");
  c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
  for (let i = 0; i < px.length; i += 4) {
    let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    if (mode === "t100") v = v > 100 ? 255 : 0;
    if (mode === "t90inv") v = v > 90 ? 0 : 255;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  return c;
}

// Возвращает список вероятных тегов (самый частый — первый)
async function readTags(file) {
  const img = await createImageBitmap(file);
  const reads = [];
  const grab = (t, strict) => {
    const re = strict ? /#\s*([0289PYLQGRJCUVO]{5,11})/g : /([0289PYLQGRJCUVO]{6,11})/g;
    for (const m of t.toUpperCase().matchAll(re)) reads.push(m[1].replace(/O/g, "0"));
  };
  const w = await Tesseract.createWorker("eng");
  try {
    await w.setParameters({ tessedit_char_whitelist: WL, tessedit_pageseg_mode: "11" });
    const sc = img.width < 1500 ? 1500 / img.width : 1;
    let box = null;
    for (const m of ["gray", "t100", "t90inv"]) {
      const { data } = await w.recognize(makeCanvas(img, 0, 0, img.width, img.height, sc, m));
      grab(data.text, true);
      if (!box) { const wd = (data.words || []).find(q => q.text.includes("#")); if (wd) box = wd.bbox; }
    }
    if (box) {   // повторное чтение только строки с тегом, крупно
      await w.setParameters({ tessedit_pageseg_mode: "7" });
      const h = box.y1 - box.y0, pad = h * 0.6;
      const sx = Math.max(0, (box.x0 - pad) / sc), sy = Math.max(0, (box.y0 - pad) / sc);
      const sw = Math.min(img.width - sx, (box.x1 - box.x0 + 2 * pad) / sc), sh = Math.min(img.height - sy, (h + 2 * pad) / sc);
      for (const m of ["gray", "t90inv", "t100"]) for (const k of [3, 4]) {
        const { data } = await w.recognize(makeCanvas(img, sx, sy, sw, sh, k, m));
        grab(data.text, false);
      }
    }
  } finally { await w.terminate(); }
  const cnt = {}; reads.forEach(r => cnt[r] = (cnt[r] || 0) + 1);
  return Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || Math.abs(a.length - 9) - Math.abs(b.length - 9)).slice(0, 8);
}

function withVariants(list) {   // + варианты без задвоенного символа (00 → 0)
  const out = [];
  for (const t of list) {
    out.push(t);
    for (let i = 1; i < t.length; i++) if (t[i] === t[i - 1]) out.push(t.slice(0, i) + t.slice(i + 1));
  }
  return [...new Set(out)].slice(0, 20);
}

function upload() {
  app.innerHTML = `<div class="icon">🛡️</div><h1>Верификация аккаунта</h1>
  <p>Подтверди, что аккаунт Brawl Stars принадлежит тебе</p>
  <div class="steps"><i class="on"></i><i></i><i></i></div>
  <input type="file" id="f" accept="image/*" class="hidden">
  <button class="drop" id="pick"><b>📷</b>Загрузить скриншот профиля<small>Мы сами найдём твой #ТЕГ</small></button>
  <p id="st"></p>
  <input type="text" id="manual" class="hidden" placeholder="#ТЕГ вручную">
  <button class="btn hidden" id="go">Продолжить</button>`;
  const f = q("f"), st = q("st");
  let found = [];
  q("pick").onclick = () => f.click();
  f.onchange = async () => {
    if (!f.files[0]) return;
    st.textContent = "Распознаём тег…"; st.className = "";
    let err = ""; found = [];
    try { found = await readTags(f.files[0]); } catch (e) { err = " (" + (e.message || e) + ")"; }
    q("manual").value = found[0] ? "#" + found[0] : "";
    st.textContent = found[0] ? "Проверь тег и нажми «Продолжить»" : "Тег не распознан — введи вручную" + err;
    q("manual").classList.remove("hidden"); q("go").classList.remove("hidden");
  };
  q("go").onclick = async () => {
    q("go").disabled = true; st.className = "";
    const raw = q("manual").value.toUpperCase().replace(/^#/, "").replace(/O/g, "0").replace(/[^0289PYLQGRJCUV]/g, "");
    // если тег не правили руками — пробуем все варианты, найденные OCR
    const cands = withVariants(raw === found[0] ? found : [raw]);
    let last;
    for (const t of cands) {
      st.textContent = "Ищем аккаунт…";
      try { return render((await call("start", { tag: t })).player); }
      catch (e) { last = e; if (e.error !== "tag_not_found") break; }
    }
    st.textContent = errText(last || {}); st.className = "err"; q("go").disabled = false;
  };
}

function pending(p) {
  app.innerHTML = `<div class="icon">🔑</div><h1>Подтверди аккаунт</h1>
  <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>
  <div class="found"><div style="font-weight:800;font-size:18px">${p.bs_name}</div><div class="tag">${p.bs_tag}</div></div>
  <p>Зайди в Brawl Stars и <b style="color:var(--or2)">смени аватарку</b> на любую другую. Затем нажми кнопку ниже.</p>
  <button class="btn" id="chk">Я сменил аватарку</button>
  <p id="st"></p><p><a href="#" id="back" style="color:var(--mut)">Другой аккаунт</a></p>`;
  q("chk").onclick = async () => {
    q("chk").disabled = true; q("st").textContent = "Проверяем…";
    try {
      const d = await call("check");
      if (d.player.status === "verified") return render(d.player);
      q("st").textContent = "Аватарка не изменилась. Подожди ~30 сек после смены и попробуй снова."; q("st").className = "err";
    } catch (e) { q("st").textContent = errText(e); q("st").className = "err"; }
    q("chk").disabled = false;
  };
  q("back").onclick = e => { e.preventDefault(); upload(); };
}

function profile(p) {
  app.innerHTML = `<img class="ava" src="${ava || p.tg_photo_url || ""}" alt="">
  <div class="nick">${p.bs_name}</div>
  <p class="tag">${p.bs_tag}</p>
  <span class="badge">✔ Аккаунт подтверждён</span>
  <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>`;
}

const q = id => document.getElementById(id);
call("me").then(d => render(d.player)).catch(e => { app.innerHTML = `<h1>Ошибка</h1><p class="err">${errText(e)}</p>`; });
</script>
</body>
</html>
