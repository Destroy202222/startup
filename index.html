<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: #1a1a24;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
        }
        .box h1 {
            color: #ffd700;
            text-align: center;
        }
        .box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        .box button {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .box button:hover {
            opacity: 0.9;
        }
        #log {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 10px;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            color: #0f0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .hidden {
            display: none;
        }
        .success {
            color: #51cf66;
            text-align: center;
            font-size: 18px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>⚡ Brawl Stars</h1>
        <p style="text-align:center;color:#888;margin-bottom:20px;">Тест Supabase</p>

        <div id="authForm">
            <input type="text" id="username" placeholder="Имя пользователя">
            <input type="password" id="password" placeholder="Пароль">
            <input type="password" id="confirm" placeholder="Подтвердите пароль">
            <button id="registerBtn">Зарегистрироваться</button>
            <button id="loginBtn" style="background:#444;color:#fff;margin-top:5px;">Войти</button>
        </div>

        <div id="result" class="hidden success">
            ✅ Успешно!<br>
            <span id="resultText"></span>
        </div>

        <div id="log">📋 Лог операций:</div>
    </div>

    <script>
        // ============================================================
        //  МАКСИМАЛЬНО ПРОСТОЙ ТЕСТ
        // ============================================================

        const log = document.getElementById('log');

        function addLog(text, isError = false) {
            const time = new Date().toLocaleTimeString();
            const color = isError ? '#ff6b6b' : '#51cf66';
            log.innerHTML += `<div style="color:${color}">[${time}] ${text}</div>`;
            log.scrollTop = log.scrollHeight;
            console.log(text);
        }

        addLog('🚀 Скрипт запущен');

        // ===== SUPABASE =====
        const supabaseUrl = 'https://txokbboyhytmiurijvyh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4b2tiYm95aHl0bWl1cmlqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzE4MjksImV4cCI6MjEwMDY0NzgyOX0.L5jASUIzGizBBo364mUqmsiWKUAHeVUUvLN4Yuttees';

        addLog('📌 Создаём клиент Supabase...');
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        addLog('✅ Клиент создан');

        // ============================================================
        //  ПРОВЕРКА ПОДКЛЮЧЕНИЯ
        // ============================================================
        async function testConnection() {
            addLog('🔍 Проверяем подключение к Supabase...');
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('count', { count: 'exact', head: true });

                if (error) {
                    addLog('❌ Ошибка подключения: ' + error.message, true);
                    return false;
                }
                addLog('✅ Подключение работает!');
                return true;
            } catch (e) {
                addLog('❌ Критическая ошибка: ' + e.message, true);
                return false;
            }
        }

        // ============================================================
        //  РЕГИСТРАЦИЯ
        // ============================================================
        async function registerUser() {
            addLog('🔵 РЕГИСТРАЦИЯ: начата');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            addLog('📝 Имя: "' + username + '"');

            if (!username || !password || !confirm) {
                addLog('❌ Заполните все поля', true);
                return;
            }
            if (password !== confirm) {
                addLog('❌ Пароли не совпадают', true);
                return;
            }
            if (password.length < 8) {
                addLog('❌ Пароль минимум 8 символов', true);
                return;
            }

            try {
                addLog('🔍 Проверяем, существует ли пользователь...');

                const { data: existing, error: checkError } = await supabase
                    .from('users')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();

                if (checkError) {
                    addLog('❌ Ошибка проверки: ' + JSON.stringify(checkError), true);
                    return;
                }

                if (existing) {
                    addLog('❌ Пользователь уже существует', true);
                    return;
                }

                addLog('👤 Создаём пользователя...');

                const { data, error } = await supabase
                    .from('users')
                    .insert([{
                        username: username,
                        password: password,
                        reg_date: new Date().toLocaleDateString('ru-RU'),
                        elo: 0,
                        wins: 0,
                        losses: 0,
                        matches: 0,
                        mvp: 0,
                        party_code: 'TEST' + Math.random().toString(36).substring(2, 5).toUpperCase()
                    }])
                    .select()
                    .single();

                if (error) {
                    addLog('❌ Ошибка создания: ' + JSON.stringify(error), true);
                    return;
                }

                addLog('✅ УСПЕХ! Пользователь создан: ' + data.username);
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('resultText').textContent = 'Пользователь ' + data.username + ' зарегистрирован!';

            } catch (e) {
                addLog('❌ Критическая ошибка: ' + e.message, true);
            }
        }

        // ============================================================
        //  ВХОД
        // ============================================================
        async function loginUser() {
            addLog('🔵 ВХОД: начат');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            addLog('📝 Имя: "' + username + '"');

            if (!username || !password) {
                addLog('❌ Заполните все поля', true);
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .maybeSingle();

                if (error) {
                    addLog('❌ Ошибка входа: ' + JSON.stringify(error), true);
                    return;
                }

                if (!data) {
                    addLog('❌ Неверное имя или пароль', true);
                    return;
                }

                addLog('✅ УСПЕХ! Найден пользователь: ' + data.username);
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('resultText').textContent = 'Добро пожаловать, ' + data.username + '!';

            } catch (e) {
                addLog('❌ Критическая ошибка: ' + e.message, true);
            }
        }

        // ============================================================
        //  ПОДКЛЮЧЕНИЕ КНОПОК
        // ============================================================
        document.getElementById('registerBtn').onclick = registerUser;
        document.getElementById('loginBtn').onclick = loginUser;

        addLog('✅ Обработчики подключены');

        // Проверяем подключение при загрузке
        setTimeout(testConnection, 1000);

        addLog('✅ ГОТОВО! Нажмите кнопку регистрации или входа');
    </script>

</body>
</html>
