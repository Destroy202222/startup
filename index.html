<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кнопок</title>
    <style>
        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #ffd70033;
            text-align: center;
        }
        h1 { color: #ffd700; margin-bottom: 30px; }
        .tab {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin: 0 5px;
            background: #333;
            color: #888;
            transition: 0.3s;
        }
        .tab.active {
            background: #ffd700;
            color: #000;
        }
        .tabs { display: flex; margin-bottom: 20px; justify-content: center; }
        .form { display: none; }
        .form.active { display: block; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        button.btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ffd700;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        button.btn:hover { background: #ffed4a; }
        .message {
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: #1a3a1a; color: #51cf66; border: 1px solid #51cf66; }
        .message.error { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
        .link { text-align: center; margin-top: 15px; color: #888; cursor: pointer; }
        .link span { color: #ffd700; font-weight: 600; }
        .link span:hover { text-decoration: underline; }
        .test-btn {
            background: #3498db;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .test-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="box">
    <h1>⚡ Тест</h1>

    <div class="tabs">
        <button class="tab active" id="tabLogin">Вход</button>
        <button class="tab" id="tabRegister">Регистрация</button>
    </div>

    <div class="form active" id="loginForm">
        <input type="text" id="loginUsername" placeholder="Имя пользователя" />
        <input type="password" id="loginPassword" placeholder="Пароль" />
        <button class="btn" id="loginBtn">Войти</button>
        <div class="message" id="loginMessage"></div>
        <div class="link">Нет аккаунта? <span id="switchToRegister">Зарегистрироваться</span></div>
    </div>

    <div class="form" id="registerForm">
        <input type="text" id="regUsername" placeholder="Имя пользователя" />
        <input type="text" id="regStandoffId" placeholder="ID Standoff 2" />
        <input type="password" id="regPassword" placeholder="Пароль (мин. 8 символов)" />
        <input type="password" id="regPasswordConfirm" placeholder="Подтвердите пароль" />
        <button class="btn" id="registerBtn">Зарегистрироваться</button>
        <div class="message" id="registerMessage"></div>
        <div class="link">Уже есть аккаунт? <span id="switchToLogin">Войти</span></div>
    </div>

    <button class="test-btn" id="testBtn">🔍 ТЕСТ КНОПКИ</button>
    <div id="testResult" style="margin-top:10px;color:#ffd700;"></div>
</div>

<script>
    console.log('🚀 СКРИПТ ЗАПУЩЕН!');

    // ============================================================
    //  ТЕСТ КНОПКИ
    // ============================================================
    document.getElementById('testBtn').addEventListener('click', function() {
        document.getElementById('testResult').textContent = '✅ КНОПКА РАБОТАЕТ! ' + new Date().toLocaleTimeString();
        console.log('🔵 КНОПКА НАЖАТА!');
    });

    // ============================================================
    //  ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
    // ============================================================
    document.getElementById('tabLogin').addEventListener('click', function() {
        console.log('🔵 КЛИК: Вход');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('registerForm').classList.remove('active');
        document.getElementById('loginMessage').className = 'message';
        document.getElementById('registerMessage').className = 'message';
    });

    document.getElementById('tabRegister').addEventListener('click', function() {
        console.log('🔵 КЛИК: Регистрация');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('registerForm').classList.add('active');
        document.getElementById('loginForm').classList.remove('active');
        document.getElementById('loginMessage').className = 'message';
        document.getElementById('registerMessage').className = 'message';
    });

    document.getElementById('switchToRegister').addEventListener('click', function() {
        console.log('🔵 КЛИК: Переход на регистрацию');
        document.getElementById('tabRegister').click();
    });

    document.getElementById('switchToLogin').addEventListener('click', function() {
        console.log('🔵 КЛИК: Переход на вход');
        document.getElementById('tabLogin').click();
    });

    // ============================================================
    //  РЕГИСТРАЦИЯ (без Supabase - просто тест)
    // ============================================================
    document.getElementById('registerBtn').addEventListener('click', function() {
        console.log('🔵 КЛИК: Регистрация');
        
        const username = document.getElementById('regUsername').value.trim();
        const standoffId = document.getElementById('regStandoffId').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regPasswordConfirm').value;
