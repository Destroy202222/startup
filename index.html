
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Stars</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #ffd700; margin-bottom: 30px; }
        h1 span { font-size: 14px; color: #888; display: block; }
        .status {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            background: #222;
            font-weight: 600;
        }
        .ok { color: #51cf66; border: 1px solid #51cf66; }
        .err { color: #ff6b6b; border: 1px solid #ff6b6b; }
        .info { color: #ffd700; border: 1px solid #ffd700; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #ffd700;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background: #ffed4a; transform: scale(1.02); }
        .log {
            text-align: left;
            font-size: 12px;
            color: #888;
            background: #111;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 60px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 60px;
            background: transparent;
            color: #888;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin: 0;
            width: auto;
        }
        .tabs button.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
        }
        .form { display: none; }
        .form.active { display: block; }
    </style>
</head>
<body>
<div class="box">
    <h1>⚡ Brawl Stars <span>Регистрация и вход</span></h1>
    
    <div class="tabs">
        <button class="active" id="tabLogin">Вход</button>
        <button id="tabRegister">Регистрация</button>
    </div>

    <!-- ВХОД -->
    <div class="form active" id="loginForm">
        <input type="text" id="loginUsername" placeholder="Имя пользователя" />
        <input type="password" id="loginPassword" placeholder="Пароль" />
        <button id="loginBtn">Войти</button>
        <div class="status info" id="loginStatus">Введите данные для входа</div>
    </div>

    <!-- РЕГИСТРАЦИЯ -->
    <div class="form" id="registerForm">
        <input type="text" id="regUsername" placeholder="Имя пользователя" />
        <input type="password" id="regPassword" placeholder="Пароль (мин. 8 символов)" />
        <input type="password" id="regConfirm" placeholder="Подтвердите пароль" />
        <button id="registerBtn">Зарегистрироваться</button>
        <div class="status info" id="registerStatus">Заполните форму для регистрации</div>
    </div>
    
    <div class="log" id="log">Жду действий...</div>
</div>

<script>
    // ============================================================
    //  SUPABASE
    // ============================================================
    const SUPABASE_URL = 'https://dlprylagddsmtzpmzxqy.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRscHJ5bGFnZGRzbXR6cG16eHF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDY5MjcsImV4cCI6MjA5OTg4MjkyN30.xyRO-nChHDfqFgtYkhsMOkM3F8BsZGOvacQ0zhjBuRI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    console.log('✅ Supabase создан');

    // ============================================================
    //  ЛОГ
    // ============================================================
    function log(text, type) {
        const logEl = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
        logEl.textContent += `\n[${time}] ${prefix} ${text}`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(`[${time}] ${prefix} ${text}`);
    }

    function setStatus(elId, text, type) {
        const el = document.getElementById(elId);
        el.textContent = text;
        el.className = 'status ' + type;
    }

    // ============================================================
    //  ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
    // ============================================================
    document.getElementById('tabLogin').addEventListener('click', function() {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('registerForm').classList.remove('active');
        setStatus('loginStatus', 'Введите данные для входа', 'info');
    });

    document.getElementById('tabRegister').addEventListener('click', function() {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('registerForm').classList.add('active');
        document.getElementById('loginForm').classList.remove('active');
        setStatus('registerStatus', 'Заполните форму для регистрации', 'info');
    });

    // ============================================================
    //  РЕГИСТРАЦИЯ (БЕЗ ЛИШНИХ ПОЛЕЙ)
    // ============================================================
    document.getElementById('registerBtn').addEventListener('click', async function() {
        log('🔵 РЕГИСТРАЦИЯ');

        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;

        if (!username || !password || !confirm) {
            setStatus('registerStatus', '❌ Заполните все поля', 'err');
            log('Ошибка: пустые поля', 'error');
            return;
        }

        if (password !== confirm) {
            setStatus('registerStatus', '❌ Пароли не совпадают', 'err');
            log('Ошибка: пароли не совпадают', 'error');
            return;
        }

        if (password.length < 8) {
            setStatus('registerStatus', '❌ Пароль минимум 8 символов', 'err');
            log('Ошибка: пароль слишком короткий', 'error');
            return;
        }

        setStatus('registerStatus', '⏳ Проверка...', 'info');
        log('Проверка имени: ' + username);

        try {
            // Проверяем имя
            const { data: existing } = await supabaseClient
                .from('users')
                .select('username')
                .eq('username', username)
                .maybeSingle();

            if (existing) {
                setStatus('registerStatus', '❌ Имя занято', 'err');
                log('Ошибка: имя занято', 'error');
                return;
            }

            log('Имя свободно', 'success');

            // СОЗДАЁМ ПОЛЬЗОВАТЕЛЯ - ТОЛЬКО ОСНОВНЫЕ ПОЛЯ
            const newUser = {
                id: Date.now().toString(),
                username: username,
                password: password,
                matches: 0,
                kills: 0,
                deaths: 0,
                serverMatches: 0,
                registered: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            };

            log('Создание пользователя...');

            const { data, error } = await supabaseClient
                .from('users')
                .insert([newUser])
                .select()
                .single();

            if (error) {
                setStatus('registerStatus', '❌ ' + error.message, 'err');
                log('Ошибка Supabase: ' + error.message, 'error');
                return;
            }

            setStatus('registerStatus', '✅ ' + username + ' создан!', 'ok');
            log('Успешно! Пользователь: ' + data.username, 'success');

        } catch (e) {
            setStatus('registerStatus', '❌ Ошибка: ' + e.message, 'err');
            log('Ошибка: ' + e.message, 'error');
        }
    });

    // ============================================================
    //  ВХОД
    // ============================================================
    document.getElementById('loginBtn').addEventListener('click', async function() {
        log('🔵 ВХОД');

        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
            setStatus('loginStatus', '❌ Заполните все поля', 'err');
            log('Ошибка: пустые поля', 'error');
            return;
        }

        setStatus('loginStatus', '⏳ Поиск...', 'info');
        log('Поиск: ' + username);

        try {
            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .maybeSingle();

            if (error) {
                setStatus('loginStatus', '❌ Ошибка сервера', 'err');
                log('Ошибка: ' + error.message, 'error');
                return;
            }

            if (!data) {
                setStatus('loginStatus', '❌ Неверное имя или пароль', 'err');
                log('Ошибка: пользователь не найден', 'error');
                return;
            }

            setStatus('loginStatus', '✅ Добро пожаловать, ' + username + '!', 'ok');
            log('Успешный вход: ' + data.username, 'success');

        } catch (e) {
            setStatus('loginStatus', '❌ Ошибка: ' + e.message, 'err');
            log('Ошибка: ' + e.message, 'error');
        }
    });

    log('Готово! Жду действий.', 'success');
</script>
</body>
</html>
