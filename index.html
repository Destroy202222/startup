<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест регистрации</title>

    <style>
        body {
            background: #0b0b0f;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: #1a1a24;
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
        }
        .box h1 {
            color: #ffd700;
            text-align: center;
        }
        .box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        .box button {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .box button:hover {
            opacity: 0.9;
        }
        #msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        #msg.success {
            background: rgba(81, 207, 102, 0.2);
            color: #51cf66;
        }
        #msg.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        #msg.info {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        .hidden {
            display: none !important;
        }
        .welcome {
            text-align: center;
        }
        .welcome .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ffd700;
            color: #000;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Форма входа/регистрации -->
        <div id="authForm" class="box">
            <h1>⚡ Brawl Stars</h1>
            <p style="text-align:center;color:#888;margin-bottom:20px;">Тест регистрации</p>

            <div id="loginBlock">
                <h2 style="text-align:center;margin-bottom:15px;">Вход</h2>
                <input type="text" id="loginUsername" placeholder="Имя пользователя">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button id="loginBtn">Войти</button>
                <p style="text-align:center;margin-top:12px;color:#888;">
                    <a href="#" id="showRegisterLink" style="color:#ffd700;">Нет аккаунта? Зарегистрироваться</a>
                </p>
            </div>

            <div id="registerBlock" class="hidden">
                <h2 style="text-align:center;margin-bottom:15px;">Регистрация</h2>
                <input type="text" id="regUsername" placeholder="Имя пользователя">
                <input type="password" id="regPassword" placeholder="Пароль (мин. 8 символов)">
                <input type="password" id="regPasswordConfirm" placeholder="Подтвердите пароль">
                <button id="registerBtn">Зарегистрироваться</button>
                <p style="text-align:center;margin-top:12px;color:#888;">
                    <a href="#" id="showLoginLink" style="color:#ffd700;">Уже есть аккаунт? Войти</a>
                </p>
            </div>

            <div id="msg"></div>
        </div>

        <!-- Приветствие после входа -->
        <div id="welcomeBlock" class="box hidden">
            <div class="welcome">
                <div class="avatar" id="userAvatar">?</div>
                <h2 id="userName">Игрок</h2>
                <p style="color:#888;margin:10px 0;">Вы успешно вошли!</p>
                <button id="logoutBtn" style="background:#ff6b6b;color:#fff;">Выйти</button>
            </div>
        </div>
    </div>
