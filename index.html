<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
</head>
<body>
    <h1>Тест Supabase</h1>
    <button onclick="test()">Нажми меня</button>
    <div id="result"></div>

    <script>
        console.log('Скрипт запущен!');

        // Данные Supabase
        const supabaseUrl = 'https://txokbboyhytmiurijvyh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4b2tiYm95aHl0bWl1cmlqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzE4MjksImV4cCI6MjEwMDY0NzgyOX0.L5jASUIzGizBBo364mUqmsiWKUAHeVUUvLN4Yuttees';

        // Создаём клиент
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        console.log('Клиент создан');

        async function test() {
            document.getElementById('result').innerHTML = '⏳ Проверяем...';
            console.log('Нажата кнопка!');

            try {
                // Пытаемся получить список пользователей
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .limit(5);

                if (error) {
                    document.getElementById('result').innerHTML = '❌ Ошибка: ' + error.message;
                    console.log('Ошибка:', error);
                    return;
                }

                document.getElementById('result').innerHTML = '✅ Успех! Найдено пользователей: ' + data.length;
                console.log('Данные:', data);

            } catch (e) {
                document.getElementById('result').innerHTML = '❌ Ошибка: ' + e.message;
                console.log('Ошибка:', e);
            }
        }
    </script>
</body>
</html>
